# T-Display-K230 Linux BSP: MBR p1=boot ext4, p2=rootfs ext4.
# U-Boot/SPL select /dev/mmcblk{0,1}p2 according to the boot medium.
# Preserve the complete template prefix; do not substitute a generic RISC-V
# U-Boot, OpenSBI or Debian kernel for the vendor boot stack.
export ROOT_PARTITION=2
export BOOT_PARTITION=1
export SERIAL_CONSOLE=ttyS0
export SERIAL_BAUD=115200
# The vendor image's generated S40 init script loads these at boot, in this
# order: both SDIO Wi-Fi drivers (RTL8189FS is the fitted chip, RTL8723DS the
# alternative), then the AIC8800 USB Wi-Fi/Bluetooth drivers when the BSP was
# built with them. Built-in display, touch and MMC drivers are left to the
# preserved kernel/DTB. Audio requirements and the Debian board services live
# in lilygo-linux-dtoverlays boards/T-Display-K230; built-in ALSA drivers must
# not be forced into .ko files.
export BSP_MODULES='8189fs 8723ds'
export BSP_OPTIONAL_MODULES='aic_load_fw aic8800_fdrv aic_btusb'
